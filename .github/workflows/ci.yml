name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d omni" --health-interval 2s --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ["3025:3025", "3143:3143", "8080:8080"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/omni
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, policies
        run: pnpm check

      - name: Types
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test:all

      # Service containers cannot pass the gateway its backend arguments; compose.yml does.
      - name: S3-compatible object store
        run: docker compose up -d --wait objects

      - name: E2E tests
        run: pnpm test:e2e
