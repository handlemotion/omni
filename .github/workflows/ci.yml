name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d omni" --health-interval 2s --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ["3025:3025", "3143:3143", "8080:8080"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/omni
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Caches the pnpm store, keyed on the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turbo's local cache: unchanged packages replay their cached unit test results. A task's
      # hash covers its sources, internal deps, and the lockfile; e2e is never cached (turbo.json).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, policies
        run: pnpm check

      - name: Types
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test:all

      # Service containers cannot pass the gateway its backend arguments; compose.yml does.
      - name: S3-compatible object store
        run: docker compose up -d --wait objects

      - name: E2E tests
        run: pnpm test:e2e
