name: CI

# The light, required check for pull requests into main: format, lint, policies, a secret scan of
# the PR's own commits, types, unit tests, and the one fast e2e suite (`@omni/db`: forMember and
# migrations, against real Postgres, ~25s). The heavy suites (worker, mail, web, client e2e) run
# in `Full` (full.yml): nightly on main, by hand, or on a PR labelled `full-e2e`.
#
# Only pull requests into main run. A stacked layer (base is another branch) runs once it is
# retargeted to main and pushed; `Run workflow` on its branch reports `Checks` too.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    # `Checks` is the required status in main's branch protection: keep this name.
    name: Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: boat-small
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/omni
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only pull requests run format, lint, policies and the secret scan, and skip the rest.
      - name: Detect docs-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            other=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -cvE '^docs/|\.md$' || true)
            if [ "$other" = "0" ]; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Run types, tests and e2e: $full"

      # Started now, without waiting, so Postgres boots while dependencies install.
      - name: Start Postgres
        if: steps.scope.outputs.full == 'true'
        run: docker compose up -d postgres

      # The official action needs a paid license for organizations; the release binary does not.
      # PRs scan only their own commits; the nightly `Full` run scans all history.
      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          range=()
          if [ -n "$BASE_SHA" ]; then range=(--log-opts="$BASE_SHA..$HEAD_SHA"); fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 \
            --config .github/gitleaks.toml "${range[@]}" .

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Caches the pnpm store, keyed on the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, policies
        run: pnpm check

      - name: Types
        if: steps.scope.outputs.full == 'true'
        run: pnpm check-types

      - name: Unit tests
        if: steps.scope.outputs.full == 'true'
        run: pnpm test:all

      - name: E2E (db)
        if: steps.scope.outputs.full == 'true'
        run: |
          docker compose up -d --wait postgres
          pnpm --filter @omni/db test:e2e
