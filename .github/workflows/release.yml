name: Release

# release-please. Every push to main updates one open release pull request, "chore:
# release main", that raises the version and writes the changelog of each app whose files the
# merged commits touched, from their Conventional Commit titles (pr-title.yml):
#
#   apps/desktop  @omni/desktop: package.json and src-tauri/tauri.conf.json   tag desktop-vX.Y.Z
#   apps/ios      @omni/ios: package.json, read by app.config.ts              tag ios-vX.Y.Z
#
# Nothing ships until someone merges that pull request. Merging it tags each raised app and makes
# its GitHub release, and the matching job below builds and publishes it: the desktop app to the
# update feed (desktop-release.yml), the iOS app to TestFlight (ios-release.yml). The web app,
# Worker and mail service deploy on every merge to main and carry no version.
#
# RELEASE_PLEASE_TOKEN (optional, a fine-grained token with contents and pull requests write):
# pull requests and tags made with the default token start no workflows, so without it `Checks`
# does not run on the release pull request by itself. Then start it by hand: Actions, CI, Run
# workflow, on the `release-please--branches--main` branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      desktop: ${{ steps.release.outputs['apps/desktop--release_created'] }}
      desktop-tag: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
      ios: ${{ steps.release.outputs['apps/ios--release_created'] }}
      ios-tag: ${{ steps.release.outputs['apps/ios--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    name: Desktop
    needs: release-please
    if: needs.release-please.outputs.desktop == 'true'
    # Write, for the installers it attaches to the GitHub release.
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop-tag }}
    secrets: inherit

  ios:
    name: iOS
    needs: release-please
    if: needs.release-please.outputs.ios == 'true'
    uses: ./.github/workflows/ios-release.yml
    with:
      tag: ${{ needs.release-please.outputs.ios-tag }}
    secrets: inherit
