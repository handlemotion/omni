name: PR title

# Pull request titles are Conventional Commits (AGENTS.md, "Shipping"): squash merge
# makes the title the commit on main, and release-please (release.yml) reads those commits to pick
# each app's next version and write its changelog. `feat` raises the minor version, `fix` and
# `perf` the patch, `!` before the colon (or a `BREAKING CHANGE:` footer) the major.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style'
          pattern="^($types)(\([a-z0-9][a-z0-9/,-]*\))?!?: [^ ].*$"
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error title=PR title::Use a Conventional Commit title, e.g. \"fix(ios): keep each workspace's mail apart\". Types: ${types//|/, }. Scope (optional) is the app or module in lowercase."
          exit 1
