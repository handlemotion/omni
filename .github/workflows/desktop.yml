name: Desktop

# The desktop app (docs/spec/desktop.md "Build, signing, release"): Rust format, Clippy
# and tests on Linux when the app or the contracts its types come from change; `Checks` is
# unchanged for everyone else.
#
# Windows is also checked on Linux, cross-compiled with cargo-xwin, so a change that breaks only
# the Windows build fails here and not first on a release. The native macOS and Windows builds are
# the expensive legs (macOS minutes cost about ten Linux ones), so they run only by hand; a tag's
# signed builds of both are `Desktop release` (desktop-release.yml).
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's Linux prerequisites (WebKitGTK 4.1), so Clippy can check the shell.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop

      # `generate_context!` reads the bundled shell's output folder at compile time.
      - name: Placeholder shell bundle
        run: mkdir -p dist && touch dist/index.html

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  windows:
    name: Rust (Windows, cross-compiled on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-xwin fetches the MSVC CRT and Windows SDK; it compiles with LLVM's clang-cl,
      # which the runner has under a versioned name.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc
          rustup default stable
          mkdir -p "$HOME/.local/bin"
          for tool in clang-cl lld-link llvm-lib llvm-rc; do
            command -v "$tool" >/dev/null || ln -sf "$(ls /usr/bin/"$tool"-* | sort -V | tail -1)" "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
          key: windows

      - run: cargo install cargo-xwin --locked

      - name: Placeholder shell bundle
        run: mkdir -p dist && touch dist/index.html

      - run: cargo xwin clippy --all-targets --locked --target x86_64-pc-windows-msvc

  build:
    name: Build (${{ matrix.os }}, unsigned)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop

      - run: pnpm install --frozen-lockfile --filter @omni/desktop...

      # Compiles the shell and builds the bundled page; no installer, no signing.
      - run: pnpm --filter @omni/desktop tauri build --no-bundle

      # The File Provider extension's Swift core and its tests (layer 6).
      - if: runner.os == 'macOS'
        run: swift test --package-path apps/desktop/macos
