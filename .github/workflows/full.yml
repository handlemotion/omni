name: Full

# The heavy suites the light `Checks` (ci.yml) leaves out: every e2e suite against the full local
# stack (Postgres, GreenMail, the S3 stand-in, the built Worker), types, unit tests, and a gitleaks
# scan of all history. Not a required status.
#
# - Daily on main at 13:17 Mexico City (19:17 UTC), skipped when main has no new commit in the
#   last day.
# - By hand: Actions > Full > Run workflow, on any branch.
# - On a pull request, by adding the `full-e2e` label, and again on each push while it has it.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  full:
    name: Full
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-e2e') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'full-e2e'))
    # GitHub-hosted, 2 vCPU / 8 GB for a private repository: about twice the old 4-vCPU time.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/omni
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip when main is idle
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt 90000 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run: $run"

      # Started now, without waiting, so the stack boots while dependencies install.
      - name: Start the local stack
        if: steps.scope.outputs.run == 'true'
        run: docker compose up -d

      - name: Secret scan of all history (gitleaks)
        if: steps.scope.outputs.run == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 \
            --config .github/gitleaks.toml .

      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Types
        if: steps.scope.outputs.run == 'true'
        run: pnpm check-types

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: pnpm test:all

      # --continue: one red package still lets the others run, so a failure hides nothing.
      # --concurrency=1: one package at a time. All at once on 4 vCPU starved the mail and web
      # timing tests (a different one failed each run); one at a time took about 11 minutes there.
      - name: E2E tests
        if: steps.scope.outputs.run == 'true'
        run: |
          docker compose up -d --wait
          pnpm test:e2e --continue --concurrency=1
