name: Deploy

# Production deploys run only from main, after CI passed on that commit. Order: migrate the
# database (additive-first, so the running versions keep working), then the mail service and the
# Worker. Every secret comes from Doppler through service tokens kept in the `production`
# environment (docs/operations/doppler.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # workflow_dispatch deploys the tip of the branch it runs on; it must be main (checked below).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  migrate:
    name: Migrate database
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @omni/db...

      - name: Apply migrations
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GITHUB }}
        run: |
          .github/scripts/doppler.sh mask
          DATABASE_URL="$(.github/scripts/doppler.sh get MIGRATE_DATABASE_URL)"
          export DATABASE_URL
          pnpm --filter @omni/db db:migrate

  mail:
    name: Deploy mail service
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
        with:
          version: 0.5.1

      - name: Deploy
        env:
          DOPPLER_TOKEN_GITHUB: ${{ secrets.DOPPLER_TOKEN_GITHUB }}
          DOPPLER_TOKEN_MAIL: ${{ secrets.DOPPLER_TOKEN_MAIL }}
        run: |
          github() { DOPPLER_TOKEN="$DOPPLER_TOKEN_GITHUB" .github/scripts/doppler.sh "$@"; }
          mail() { DOPPLER_TOKEN="$DOPPLER_TOKEN_MAIL" .github/scripts/doppler.sh "$@"; }
          github mask
          mail mask
          FLY_API_TOKEN="$(github get FLY_API_TOKEN)"
          export FLY_API_TOKEN
          # Stage every prd_mail secret; the deploy below applies them with the new image.
          mail env \
            | flyctl secrets import --stage --config apps/mail/fly.toml
          flyctl deploy . --config apps/mail/fly.toml --remote-only --wait-timeout 5m

      - name: Health
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://omni-mail.fly.dev/health

  worker:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @omni/worker...

      # wrangler.jsonc keeps neutral defaults (self-hosting); production ids, domain and vars come
      # from Doppler prd_github, secrets from prd_worker.
      - name: Deploy
        env:
          DOPPLER_TOKEN_GITHUB: ${{ secrets.DOPPLER_TOKEN_GITHUB }}
          DOPPLER_TOKEN_WORKER: ${{ secrets.DOPPLER_TOKEN_WORKER }}
        run: |
          github() { DOPPLER_TOKEN="$DOPPLER_TOKEN_GITHUB" .github/scripts/doppler.sh "$@"; }
          worker() { DOPPLER_TOKEN="$DOPPLER_TOKEN_WORKER" .github/scripts/doppler.sh "$@"; }
          github mask
          worker mask
          CLOUDFLARE_API_TOKEN="$(github get CLOUDFLARE_API_TOKEN)"
          CLOUDFLARE_ACCOUNT_ID="$(github get CLOUDFLARE_ACCOUNT_ID)"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          hyperdrive_id="$(github get HYPERDRIVE_ID)"
          domain="$(github get WORKER_DOMAIN)"
          sed -i "s/\"id\": \"00000000000000000000000000000000\"/\"id\": \"$hyperdrive_id\"/" \
            apps/worker/wrangler.jsonc
          grep -q "$hyperdrive_id" apps/worker/wrangler.jsonc

          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          worker json > "$secrets_file"
          # WORKER_VAR_<NAME> in prd_github becomes the Worker var <NAME>.
          mapfile -t vars < <(github vars WORKER_VAR_)
          var_args=()
          for v in "${vars[@]}"; do var_args+=(--var "$v"); done

          cd apps/worker
          pnpm exec wrangler deploy --secrets-file "$secrets_file" --domain "$domain" "${var_args[@]}"
          rm -f "$secrets_file"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "https://$domain/health"
