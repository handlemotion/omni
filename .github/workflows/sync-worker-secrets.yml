name: Sync Worker secrets

# Doppler prd_worker -> the Worker's secrets. Deploys are the platforms' own: Cloudflare Workers
# Builds deploys the Worker and Fly's GitHub deploy the mail service (migrations run in fly.toml's
# release_command); Doppler syncs Fly's secrets itself. Doppler has no automatic sync for Workers
# secrets, so this is the one job left here.
#
# `wrangler secret bulk` deploys a new version of the latest one, so on a push it first waits for
# that commit's Cloudflare build (its GitHub check run) to finish: otherwise a sync that read the
# version before Cloudflare deployed the new one could put the old code back.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  sync:
    name: Sync Worker secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @omni/worker

      - name: Wait for Cloudflare's deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-checks.sh "$GITHUB_SHA"

      - name: Sync
        env:
          DOPPLER_TOKEN_GITHUB: ${{ secrets.DOPPLER_TOKEN_GITHUB }}
          DOPPLER_TOKEN_WORKER: ${{ secrets.DOPPLER_TOKEN_WORKER }}
        run: |
          github() { DOPPLER_TOKEN="$DOPPLER_TOKEN_GITHUB" .github/scripts/doppler.sh "$@"; }
          worker() { DOPPLER_TOKEN="$DOPPLER_TOKEN_WORKER" .github/scripts/doppler.sh "$@"; }
          github mask
          worker mask
          CLOUDFLARE_API_TOKEN="$(github get CLOUDFLARE_API_TOKEN)"
          CLOUDFLARE_ACCOUNT_ID="$(github get CLOUDFLARE_ACCOUNT_ID)"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          worker json > "$secrets_file"
          cd apps/worker
          pnpm exec wrangler secret bulk "$secrets_file"
          rm -f "$secrets_file"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "https://$(github get WORKER_DOMAIN | cut -d, -f1)/health"
