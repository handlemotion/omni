version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Actions run with repository tokens; let a release age before we pin it.
    cooldown:
      default-days: 7
    # PR titles are Conventional Commits (pr-title.yml): "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    # Monthly: each update PR costs a CI run. Security updates still open as soon as they exist.
    schedule:
      interval: monthly
    # Matches minimumReleaseAge (1 day) in pnpm-workspace.yaml, so pnpm can install what we propose.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    # "build(deps): bump ...": a dependency bump alone never cuts a release.
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
