version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Actions run with repository tokens; let a release age before we pin it.
    cooldown:
      default-days: 7
    # PR titles are Conventional Commits (pr-title.yml): "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    # Monthly: each update PR costs a CI run. Security updates still open as soon as they exist.
    schedule:
      interval: monthly
    # Matches minimumReleaseAge (1 day) in pnpm-workspace.yaml, so pnpm can install what we propose.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    # "build(deps): bump ...": a dependency bump alone never cuts a release.
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Expo pins these for apps/ios (expo/bundledNativeModules.json); a version off that list
      # breaks the native build or fails React Native's exact React match. Move them with
      # `npx expo install --fix` when the SDK changes. Ignore rules can't be scoped to one
      # workspace, so react and react-dom stop here for apps/web too: bump those by hand.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Must match the version @better-auth/passkey depends on, or createAuth's types can't be
      # named. Take the next major when better-auth's passkey plugin does.
      - dependency-name: "@simplewebauthn/server"
        update-types: ["version-update:semver-major"]
