<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fdfdfd" />
    <!-- Startup: what every signed-in screen asks for first starts with the page, alongside the
         scripts, instead of after them (a round trip or two saved). The app's own `fetch` takes
         these answers (same URL and credentials mode); signed out they are quick 401s. -->
    <link rel="preload" as="fetch" crossorigin="use-credentials" href="/api/auth/get-session" />
    <link rel="preload" as="fetch" crossorigin="use-credentials" href="/api/me" />
    <link rel="preload" as="fetch" crossorigin="use-credentials" href="/api/mailboxes" />
    <link rel="preload" as="fetch" crossorigin="use-credentials" href="/api/mailboxes?scope=all" />
    <link rel="preload" as="fetch" crossorigin="use-credentials" href="/api/counts?scope=all" />
    <link
      rel="preload"
      as="fetch"
      crossorigin="use-credentials"
      href="/api/workspaces?include=personal"
    />
    <!-- The Inbox's first page: where `/` and almost every visit land. Elsewhere it goes unused. -->
    <link
      rel="preload"
      as="fetch"
      crossorigin="use-credentials"
      href="/api/threads?scope=all&view=inbox&limit=50"
    />
    <!-- The text face, so the first render already uses it (no swap and re-layout after). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />
    <!-- The loading screen, until the first screen is ready (src/main.tsx removes it): starting,
         and every reload (an update, a sign-in, the desktop app reopening a page). Static, so it
         shows before any script runs. The mark fades in late: a quick start shows nothing. -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        pointer-events: none;
        transition: opacity 150ms ease-out;
      }
      #app-loading[data-done] {
        opacity: 0;
      }
      #app-loading svg {
        width: 56px;
        height: 56px;
        opacity: 0;
        animation: app-loading-in 300ms ease-out 400ms forwards;
      }
      @keyframes app-loading-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#0e2896" />
        <circle cx="16" cy="16" r="11.52" fill="#f2e4c8" />
        <path
          fill="#0e2896"
          d="M16 4.48A12.261 12.261 0 0 0 16 27.52A14.765 14.765 0 0 1 16 4.48ZM16 4.48A12.261 12.261 0 0 1 16 27.52A14.765 14.765 0 0 0 16 4.48Z"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
