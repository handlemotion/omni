<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omni</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #6b6b6b;
        --line: #e4e4e4;
        --accent: #111111;
        --on-accent: #ffffff;
        font:
          14px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f2f2f2;
          --muted: #9a9a9a;
          --line: #2c2c2c;
          --accent: #f2f2f2;
          --on-accent: #141414;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
      }
      form {
        display: grid;
        gap: 12px;
        width: min(320px, calc(100vw - 32px));
      }
      form[hidden] {
        display: none;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 600;
        text-align: center;
        overflow-wrap: anywhere;
      }
      input,
      button {
        font: inherit;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: var(--bg);
        color: var(--fg);
      }
      input[aria-invalid="true"] {
        border-color: #d93636;
      }
      button {
        cursor: default;
      }
      button[type="submit"] {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
      }
      /* The loading screen: the app's own, the app's background (apps/web/index.html), so
         the hand-over to the server's page shows no seam. The mark fades in late: a quick start
         shows nothing. */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      #loading[hidden] {
        display: none;
      }
      #loading svg {
        width: 56px;
        height: 56px;
        opacity: 0;
        animation: loading-in 300ms ease-out 400ms forwards;
      }
      /* Windows, with the frame off (the server's web app took it): the window's top row, a drag
         region, with minimize, maximize and close at its end, drawn as Windows draws them. */
      #caption {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1;
        display: flex;
        justify-content: flex-end;
        height: 48px;
      }
      #caption[hidden] {
        display: none;
      }
      #caption button {
        width: 46px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--fg);
        font:
          10px "Segoe Fluent Icons",
          "Segoe MDL2 Assets";
      }
      #caption button:hover {
        background: color-mix(in srgb, var(--fg) 4%, transparent);
      }
      #caption button:active {
        background: color-mix(in srgb, var(--fg) 2%, transparent);
      }
      /* Over the loading screen's white, whatever the system's appearance. */
      body:has(#loading:not([hidden])) #caption {
        --fg: #111111;
      }
      #caption button#close:hover {
        background: #c42b1c;
        color: #ffffff;
      }
      #caption button#close:active {
        background: rgb(196 43 28 / 0.9);
        color: #ffffff;
      }
      @keyframes loading-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="caption" data-tauri-drag-region hidden>
      <button type="button" id="minimize" aria-label="Minimize">&#xE921;</button>
      <button type="button" id="maximize" aria-label="Maximize">&#xE922;</button>
      <button type="button" id="close" aria-label="Close">&#xE8BB;</button>
    </div>
    <div id="loading" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#0d3eef" />
        <g
          transform="translate(16 16) scale(0.95) translate(-14 -14)"
          fill="none"
          stroke="#fff"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 23.625V14M14 14V9.1875C14 6.52963 11.8454 4.375 9.1875 4.375C6.52963 4.375 4.375 6.52963 4.375 9.1875C4.375 11.8454 6.52963 14 9.1875 14H14ZM14 14H23.3333"
          />
          <path d="M19.5417 9.91667L23.625 14L19.5417 18.0833" />
        </g>
      </svg>
    </div>
    <form id="picker" hidden>
      <h1>Omni Server</h1>
      <input
        name="origin"
        type="text"
        inputmode="url"
        autocomplete="url"
        autocapitalize="off"
        spellcheck="false"
        placeholder="omni.example.com"
        aria-label="Server"
        required
      />
      <button type="submit">Continue</button>
    </form>
    <form id="offline" hidden>
      <h1 id="offline-host"></h1>
      <button type="submit">Try Again</button>
      <button type="button" id="change">Change Server</button>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
