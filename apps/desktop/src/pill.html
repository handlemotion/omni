<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wok recording</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #6b6b6b;
        --line: #e4e4e4;
        --hover: #f0f0f0;
        --recording: #e5484d;
        font:
          13px/1 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f2f2f2;
          --muted: #9a9a9a;
          --line: #2c2c2c;
          --hover: #242424;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--fg);
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 6px 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--recording);
        flex: none;
      }
      [data-state="paused"] .dot {
        background: var(--muted);
      }
      time {
        font-variant-numeric: tabular-nums;
        min-width: 40px;
      }
      .level {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
      }
      .level span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--fg);
        transition: width 120ms ease-out;
      }
      button {
        flex: none;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        padding: 0;
        transition:
          background-color 120ms ease-out,
          color 120ms ease-out,
          transform 120ms ease-out;
      }
      button:hover {
        background: var(--hover);
        color: var(--fg);
      }
      button:active {
        transform: scale(0.94);
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: -2px;
      }
      button + button {
        margin-inline-start: -6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .level span,
        button {
          transition: none;
        }
      }
      .pause i {
        width: 8px;
        height: 10px;
        border-inline: 3px solid currentColor;
        box-sizing: border-box;
      }
      [data-state="paused"] .pause i {
        width: 0;
        height: 0;
        border-inline: 0;
        border-block: 5px solid transparent;
        border-left: 8px solid currentColor;
        margin-inline-start: 2px;
      }
      .stop i {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--recording);
      }
    </style>
    <script type="module" src="./pill.ts"></script>
  </head>
  <body>
    <main data-tauri-drag-region data-state="recording">
      <span class="dot" data-tauri-drag-region></span>
      <time data-tauri-drag-region>0:00</time>
      <span class="level" data-tauri-drag-region><span></span></span>
      <button class="pause" type="button" aria-label="Pause"><i></i></button>
      <button class="stop" type="button" aria-label="Stop"><i></i></button>
    </main>
  </body>
</html>
