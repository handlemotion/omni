# The meeting recorder (docs/spec/meetings.md, "Capture"): the computer's sound and the
# microphone on two channels, encoded as Opus in Ogg into a spool on disk that survives a crash.
# No Tauri here, so `omni-record` (src/bin) drives the same code from a terminal and from tests.
[package]
name = "omni-recorder"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
omni-sync-types.workspace = true
serde_json.workspace = true
opus = "0.4.0"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27.0"

[lints]
workspace = true
