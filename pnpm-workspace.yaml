packages:
  - apps/*
  - packages/*

# Supply-chain guard: never install a version published less than a day ago.
minimumReleaseAge: 1440

allowBuilds:
  # Central Icons: its only script is a license-key check at install. Skipped.
  "@central-icons-react/round-outlined-radius-3-stroke-1.5": false
  "@central-icons-react/round-filled-radius-3-stroke-1.5": false
  "@central-icons-react-native/round-outlined-radius-3-stroke-1.5": false
  "@central-icons-react-native/round-filled-radius-3-stroke-1.5": false
  # sentry-cli's postinstall only fetches a binary its optional platform package already ships.
  "@sentry/cli": false
  bun: true
  esbuild: true
  lefthook: true
  workerd: true
  sharp: false

patchedDependencies:
  react-aria@3.53.1: patches/react-aria@3.53.1.patch

# drizzle-kit 0.31 (latest stable) still loads the deprecated @esbuild-kit loader, which pins
# esbuild 0.18 (GHSA-67mh-4wv8-2f99). Give it the esbuild drizzle-kit itself already uses.
# Drop this once drizzle-kit stops depending on @esbuild-kit.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # @sentry/bundler-plugins 11.10.0 (latest) pins glob ^13, whose glob and minimatch carry
  # GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249. Sentry only calls `glob(patterns, options)`,
  # unchanged in 14. Drop this once Sentry depends on glob >= 14.0.2.
  "@sentry/bundler-plugins>glob": 14.0.3
  # @expo/fingerprint (latest, 0.21.10) asks for minimatch ^10.2.6, which carries
  # GHSA-g3hv-75wg-m249. It only builds `new Minimatch(pattern, options)`, unchanged in 11. Drop
  # this once it depends on minimatch >= 11.0.1.
  "@expo/fingerprint>minimatch": 11.0.4
