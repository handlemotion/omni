# Local stack: `pnpm stack:up`. Nothing here talks to a real mailbox or a real database.
services:
  postgres:
    image: postgres:18-alpine
    container_name: omni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni
    ports:
      - "54329:5432"
    volumes:
      - omni-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d omni"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Local IMAP + SMTP server. Users are created on first login (any password works).
  greenmail:
    image: greenmail/standalone:2.1.5
    container_name: omni-greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
      - "3465:3465" # SMTPS
      - "3993:3993" # IMAPS
      - "8080:8080" # REST API (purge, create users)
    healthcheck:
      # Ask the REST API, not the IMAP port: an IMAP socket closed without LOGOUT leaves a
      # GreenMail handler thread spinning, and one every 2s pegs the CPU within minutes.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/service/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible object store standing in for R2 (raw mail, sanitized HTML, attachments).
  # Each top-level directory is a bucket; `omni-mail-dev` exists from the start.
  objects:
    image: versity/versitygw:v1.9.0
    container_name: omni-objects
    environment:
      ROOT_ACCESS_KEY_ID: omni-local
      ROOT_SECRET_ACCESS_KEY: omni-local-secret
      # R2 signs with region `auto`; accept the same here.
      VGW_REGION: auto
    entrypoint: ["sh", "-c", "mkdir -p /data/omni-mail-dev && exec versitygw posix /data"]
    ports:
      - "7070:7070"
    volumes:
      - omni-objects-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  omni-postgres-data:
  omni-objects-data:
